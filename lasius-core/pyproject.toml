[project]
name = "lasius-core"
version = "0.1.0"
description = "Robotics backend, kinematics, 50 Hz harmonic gait engine and hardware server for the Lasius hexapod."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "smbus2>=0.5.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
lasius-server = "lasius.core.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
