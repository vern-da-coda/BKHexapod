[project]
name = "lasius-workspace"
version = "0.1.0"
description = "Monorepo workspace for Lasius hexapod robot software"
requires-python = ">=3.11"
dependencies = [
    "lasius-core",
    "lasius-pilot",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.workspace]
members = [
    "lasius-core",
    "lasius-pilot",
]

[tool.uv.sources]
lasius-core = { workspace = true }
lasius-pilot = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [
    "lasius-core/src",
    "lasius-pilot/src",
]
testpaths = [
    "lasius-core/tests",
    "lasius-pilot/tests",
]

