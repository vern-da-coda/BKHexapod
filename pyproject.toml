[project]
name = "bkhexapod"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pip==25.1.1",
    "pyyaml>=6.0.3",
    "smbus2==0.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "websockets>=12.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["bkhexapod"]
