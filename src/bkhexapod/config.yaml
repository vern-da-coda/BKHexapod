# config.yaml
#
# Complete configuration for the BKHexapod robot:
# 1. Physical robot geometry (leg segments, chassis dimensions, default stance)
# 2. Servo calibrations and PWM mapping (18 servos on two PCA9685 boards)

# ==============================================================================
# 1. Physical Robot Geometry
# ==============================================================================
geometry:
  # Leg segment lengths (distance between joint rotation axes in mm)
  limbs:
    coxa: 60.0    # Inner segment (Coxa)
    femur: 100.0  # Middle segment (Femur)
    tibia: 130.0  # Outer segment (Tibia)

  # Chassis dimensions (mount points for the Coxa servos in mm)
  chassis:
    width_front_rear: 130.0            # Distance between left & right coxa axes (front and rear)
    width_middle: 150.0                # Distance between left & right coxa axes (middle)
    axis_distance_longitudinal: 90.0   # Distance along Y-axis between front-to-middle and middle-to-rear

  # Default stance parameters (in mm)
  default_stance:
    ground_clearance: 80.0             # Default body height above ground
    foot_radius_offset: 120.0          # Neutral foot radius from coxa joint


# ==============================================================================
# 2. Servo Calibration & Channel Mapping
# ==============================================================================
servos:
  # --- Left Side (Board 0x40) ---
  - name: "left_front_coxa"
    board_address: 0x40
    channel: 0
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -45
    max_angle: 45
    orientation: 1
  - name: "left_front_femur"
    board_address: 0x40
    channel: 1
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: 1
  - name: "left_front_tibia"
    board_address: 0x40
    channel: 2
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: 1

  - name: "left_middle_coxa"
    board_address: 0x40
    channel: 4
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -45
    max_angle: 45
    orientation: 1
  - name: "left_middle_femur"
    board_address: 0x40
    channel: 5
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: 1
  - name: "left_middle_tibia"
    board_address: 0x40
    channel: 6
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: 1

  - name: "left_rear_coxa"
    board_address: 0x40
    channel: 8
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -45
    max_angle: 45
    orientation: 1
  - name: "left_rear_femur"
    board_address: 0x40
    channel: 9
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: 1
  - name: "left_rear_tibia"
    board_address: 0x40
    channel: 10
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: 1

  # --- Right Side (Board 0x41) ---
  - name: "right_front_coxa"
    board_address: 0x41
    channel: 0
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -45
    max_angle: 45
    orientation: -1 # Right side is often mirrored
  - name: "right_front_femur"
    board_address: 0x41
    channel: 1
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: -1
  - name: "right_front_tibia"
    board_address: 0x41
    channel: 2
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: -1

  - name: "right_middle_coxa"
    board_address: 0x41
    channel: 4
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -45
    max_angle: 45
    orientation: -1
  - name: "right_middle_femur"
    board_address: 0x41
    channel: 5
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: -1
  - name: "right_middle_tibia"
    board_address: 0x41
    channel: 6
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: -1

  - name: "right_rear_coxa"
    board_address: 0x41
    channel: 8
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -45
    max_angle: 45
    orientation: -1
  - name: "right_rear_femur"
    board_address: 0x41
    channel: 9
    center_offset_pulse: 0
    pulse_range: 2000
    min_angle: -90
    max_angle: 90
    orientation: -1
  - name: "right_rear_tibia"
    board_address: 0x41
    channel: 10
